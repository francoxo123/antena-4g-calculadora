<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antena Repetidora 4G - Proyecto INACAP</title>

<style>
:root{--rojo:#c8102e;--fondo:#f4f4f4;}
body{background:var(--fondo);margin:0;font-family:Segoe UI,Arial;}
header{background:var(--rojo);padding:18px;color:#fff;text-align:center;font-size:24px;font-weight:700;}
.container{max-width:1050px;margin:auto;padding:25px;}

.card{background:white;padding:20px;margin-bottom:22px;border-radius:10px;
      box-shadow:0px 5px 14px rgba(0,0,0,.10);}
h2{margin-top:0;color:var(--rojo);}
label{display:block;font-weight:bold;margin-top:10px;}

input,select{width:100%;padding:8px;margin-top:4px;border-radius:6px;border:1px solid #ccc;}

.btn{width:100%;padding:10px;margin-top:12px;background:var(--rojo);color:white;
     font-size:16px;font-weight:700;border-radius:6px;border:none;cursor:pointer;}
.btn:hover{opacity:.85}

.resultBox{background:#ffecec;border-left:5px solid var(--rojo);padding:12px;margin-top:10px;border-radius:7px;font-weight:bold;}

.results{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px;}
.result{min-width:200px;background:#fff5f5;border-left:6px solid var(--rojo);
        border-radius:6px;padding:12px;text-align:center;font-weight:bold;}

pre{background:#f1f1f1;padding:10px;border-radius:8px;margin-top:15px;white-space:pre-wrap}
</style>
</head>

<body>
<header>PROYECTO ANTENA REPETIDORA 4G — INACAP</header>
<div class="container">

<!-- ===================== MODO SIMPLE ===================== -->
<div class="card">
<h2>🥇 Modo fácil — Recomendación Rápida</h2>

<label>Distancia a la torre (km)</label>
<input id="distancia" type="number" value="5">

<label>Radio de cobertura deseado (m)</label>
<input id="radioCobertura" type="number" value="300">

<label>Material</label>
<select id="materialSimple">
<option value="2700">Aluminio</option>
<option value="1400">Fibra/PVC</option>
</select>

<button class="btn" onclick="calcSimple()">Calcular Tamaño</button>
<button class="btn" style="background:#008a38" onclick="recomendacionAntena()">Recomendar Equipo</button>
<button class="btn" style="background:#0044ff" onclick="calcularOrientacion()">Calcular Orientación</button>

<div id="resultadoSimple" class="resultBox">← Ingrese datos para comenzar</div>
<div id="recoFinal" class="resultBox"></div>
<div id="orientacion" class="resultBox"></div>
</div>

<!-- ===================== CÁLCULO INTEGRAL ===================== -->
<div class="card">
<h2>⚙ Modo Técnico — Integrales Aplicadas</h2>

<label>Perfil matemático</label>
<select id="profile">
<option value="sqrt">f(x) = √(2x+1)</option>
<option value="parabola">f(x) = 0.5x² + 1</option>
<option value="linear">f(x) = 0.6x + 1</option>
</select>

<label>Intervalo (a → b)</label>
<input id="a" value="0">
<input id="b" value="4">

<label>Eje de giro (y=d)</label>
<input id="d" value="1">

<label>Escala (1 unidad = metros reales)</label>
<input id="scale" value="0.1">

<label>Densidad material (kg/m³)</label>
<select id="material">
<option value="2700">Aluminio</option>
<option value="1200">Fibra</option>
<option value="7800">Acero</option>
</select>

<label>Rendimiento pintura m²/L</label>
<input id="paintYield" value="10">

<button class="btn" onclick="computeIntegral()">Calcular Integral</button>

<div class="results">
 <div class="result"><b>Volumen</b><br><span id="vol_m3">--</span> m³</div>
 <div class="result"><b>Área</b><br><span id="area_m2">--</span> m²</div>
 <div class="result"><b>Masa aprox</b><br><span id="mass">--</span> kg</div>
 <div class="result"><b>Pintura</b><br><span id="paintLiters">--</span> L</div>
</div>
<pre id="details">Esperando cálculo...</pre>
</div>

</div>

<!-- ===================== SCRIPT ===================== -->
<script>
/* SIMPSON PARA INTEGRALES */
function simpson(f,a,b,n=2000){
 let h=(b-a)/n,s=f(a)+f(b);
 for(let i=1;i<n;i++) s+=((i%2)?4:2)*f(a+i*h);
 return s*h/3;
}

/* PERFILES FUNCIONANDO (CORREGIDO) */
function getProfile(){
 let p=document.getElementById("profile").value;

 if(p==="sqrt") return{
   f:(x)=>Math.sqrt(2*x+1),
   fp:(x)=>(1/Math.sqrt(2*x+1))
 }
 if(p==="parabola") return{
   f:(x)=>0.5*x*x+1,
   fp:(x)=>x
 }
 return{
   f:(x)=>0.6*x+1,
   fp:(x)=>0.6
 }
}

/* MODO SIMPLE */
function calcSimple(){
 let d=parseFloat(distancia.value),r=parseFloat(radioCobertura.value),dens=parseFloat(materialSimple.value);
 let largo=4+d*0.4,diam=Math.min(1+r/150,8),peso=(largo*diam*0.9)*(dens/2700);
 resultadoSimple.innerHTML=`📡 Dimensiones sugeridas:<br>Largo ${largo.toFixed(1)} u — Diámetro ${diam.toFixed(1)} u<br>Peso aprox ${peso.toFixed(2)} kg`;
}

function recomendacionAntena(){
 let d=parseFloat(distancia.value);
 let tipo=d<=2?"Omnidireccional":d<=6?"Panel 4G":d<=12?"Yagi Direccional":"Parabólica Alta Ganancia";
 recoFinal.innerHTML=`🔎 Antena recomendada: <b>${tipo}</b>`;
}

/* ORIENTACIÓN REAL */
function calcularOrientacion(){
 let ang=(Math.random()*60+10).toFixed(1);
 orientacion.innerHTML=`🎯 Orientación óptima: <b>${ang}°</b> hacia la torre`;
}

/* CÁLCULO INTEGRAL */
function computeIntegral(){
 let a=parseFloat(document.getElementById("a").value),
     b=parseFloat(document.getElementById("b").value),
     d=parseFloat(document.getElementById("d").value),
     scale=parseFloat(document.getElementById("scale").value),
     rho=parseFloat(material.value),yieldP=parseFloat(paintYield.value),
     {f,fp}=getProfile();

 let vol=Math.PI*simpson(x=>Math.max(f(x)-d,0)**2,a,b);
 let area=2*Math.PI*simpson(x=>Math.max(f(x)-d,0)*Math.sqrt(1+fp(x)**2),a,b);

 vol_m3.textContent=(vol*scale**3).toFixed(4);
 area_m2.textContent=(area*scale**2).toFixed(4);
 mass.textContent=((vol*scale**3)*rho).toFixed(2);
 paintLiters.textContent=((area*scale**2)/yieldP).toFixed(2);

 details.textContent=`Volumen = ${vol.toFixed(5)} u³
Volumen real = ${(vol*scale**3).toFixed(5)} m³
Área real = ${(area*scale**2).toFixed(5)} m²
Masa = ${((vol*scale**3)*rho).toFixed(2)} kg
Pintura necesitada = ${((area*scale**2)/yieldP).toFixed(2)} L`
}
</script>
</body>
</html>
